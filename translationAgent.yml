          \ # 大小写区分含义的词\n\ndef _as_text(v):                      # 归一：array[string]\
          \ / None -> str\n    if isinstance(v, list):\n        return \"\\n\".join(x\
          \ for x in v if isinstance(x, str))\n    return v or \"\"\n\ndef _parse(csv_text):\n\
          \    csv_text = csv_text.lstrip(\"\\ufeff\")          # 去 BOM\n    rows\
          \ = []\n    for line in csv_text.splitlines():            # 兼容 \\r\\n /\
          \ \\n\n        line = line.strip()\n        if not line or \",\" not in\
          \ line:\n            continue\n        de, _, it = line.partition(\",\"\
          )\n        de, it = de.strip(), it.strip()\n        if not de or not it:\n\
          \            continue\n        if de.lower() == \"de\" and it.lower() ==\
          \ \"it\":  # 跳过混入的表头行\n            continue\n        rows.append((de, it))\n\
          \    return rows\n\ndef _index(rows, direction):\n    return {it: de for\
          \ de, it in rows} if direction == \"it2de\" else {de: it for de, it in rows}\n\
          \ndef _pattern(terms):\n    if not terms:\n        return None\n    alts\
          \ = [re.escape(t) for t in sorted(terms, key=len, reverse=True)]\n    return\
          \ re.compile(r\"(?<!\\w)(?:\" + \"|\".join(alts) + r\")(?!\\w)\", re.UNICODE)\n\
          \ndef _extract_json(blob):\n    dec = json.JSONDecoder()\n    i, n = 0,\
          \ len(blob)\n    while i < n:\n        j = blob.find(\"{\")\n        if\
          \ j < 0:\n            break\n        try:\n            obj, end = dec.raw_decode(blob,\
          \ j)\n            if isinstance(obj, dict) and \"segments\" in obj:\n  \
          \              return obj\n            i = end\n        except json.JSONDecodeError:\n\
          \            i = j + 1\n    return {}\n\ndef main(csv_text: str, segments_json,\
          \ direction: str) -> dict:\n    csv_text = _as_text(csv_text)          \
          \       # 新增：归一\n    segments_json = _as_text(segments_json)       # 新增：归一（文档提取器给的是\
          \ array[string]）\n    rows = _parse(csv_text)\n    index = _index(rows,\
          \ direction or \"de2it\")\n    obj = _extract_json(segments_json)\n    segs\
          \ = obj.get(\"segments\", []) if isinstance(obj, dict) else []\n    text\
          \ = \"\\n\".join(s.get(\"text\", \"\") for s in segs)\n    cs = [t for t\
          \ in index if t in CASE_SENSITIVE]\n    ci = [t for t in index if t not\
          \ in CASE_SENSITIVE]\n    hits, seen = [], set()\n    p = _pattern(cs)\n\
          \    if p:\n        for m in p.finditer(text or \"\"):\n            s =\
          \ m.group(0)\n            if s in index and s not in seen:\n           \
          \     seen.add(s); hits.append((s, index[s]))\n    p = _pattern(ci)\n  \
          \  if p:\n        low = {t.lower(): t for t in ci}\n        for m in re.finditer(p.pattern,\
          \ text or \"\", re.UNICODE | re.IGNORECASE):\n            c = low.get(m.group(0).lower())\n\
          \            if c and c not in seen:\n                seen.add(c); hits.append((c,\
          \ index[c]))\n    if hits:\n        block = (\"[强制术语约束] 以下术语必须严格按指定译法翻译，不得改写或意译，遇到即整体替换：\\\
          n\"\n                 + \"\\n\".join(f\"- {s} -> {t}\" for s, t in hits))\n\
          \    else:\n        block = \"\"\n    return {\"prompt_block\": block, \"\
          hit_count\": len(hits),\n            \"term_count\": len(rows), \"segments_clean\"\
          : json.dumps({\"segments\": segs}, ensure_ascii=False)}\n"
