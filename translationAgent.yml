          \ batch's output well under num_predict=4096\n\ndef _extract(blob):\n  \
          \  if not blob:\n        return {}\n    try:\n        o = json.loads(blob)\n\
          \        if isinstance(o, dict) and \"segments\" in o:\n            return\
          \ o\n    except Exception:\n        pass\n    dec = json.JSONDecoder();\
          \ i = 0\n    while i < len(blob):\n        j = blob.find(\"{\", i)\n   \
          \     if j < 0:\n            break\n        try:\n            o, end = dec.raw_decode(blob,\
          \ j)\n            if isinstance(o, dict) and \"segments\" in o:\n      \
          \          return o\n            i = end\n        except json.JSONDecodeError:\n\
          \            i = j + 1\n    return {}\n\ndef main(segments_clean: str) ->\
          \ dict:\n    obj = _extract(segments_clean or \"\")\n    segs = obj.get(\"\
          segments\", []) if isinstance(obj, dict) else []\n    batches = []\n   \
          \ for k in range(0, len(segs), BATCH_SIZE):\n        batches.append(json.dumps({\"\
          segments\": segs[k:k+BATCH_SIZE]}, ensure_ascii=False))\n    if not batches:\n\
          \        batches = [json.dumps({\"segments\": []}, ensure_ascii=False)]\n\
          \    return {\"batches\": batches, \"batch_count\": len(batches), \"segment_count\"\
          : len(segs)}\n"
